services:
  upload:
    build:
      context: .
      dockerfile: dockerfile
      target: upload
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/video_db?sslmode=disable
      REDIS_ADDR: redis:6379
      REDIS_PWD: redis
      UPLOAD_DIR: /data/uploads
    volumes:
      - media:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: dockerfile
      target: worker
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/video_db?sslmode=disable
      REDIS_ADDR: redis:6379
      REDIS_PWD: redis
      FFMPEG_BIN: ffmpeg
      FFMPEG_WORKDIR: /data/transcode
      UPLOAD_DIR: /data/uploads
    volumes:
      - media:/data
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: video_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    command: redis-server --requirepass redis
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
  media: